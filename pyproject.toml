[project]
name = "proj-template"
description = "OAP template — smoke-test scaffold for scripts/gate.sh and Husky hooks."
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ty",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/proj_template"]
